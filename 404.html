<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | BS Gamer_z.</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/logo-192.png" type="image/png">
    <style>
        /* Custom styles for the 404 page only */
        body {
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .error-box {
            max-width: 500px;
            padding: 30px;
        }
        
        .error-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 80px;
            color: #ff0000;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        
        .error-text {
            color: #ccc;
            margin: 15px 0 25px;
            font-size: 18px;
        }
        
        .home-btn {
            display: inline-block;
            background: #ff0000;
            color: #fff;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        
        .home-btn:hover {
            background: #cc0000;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="error-box">
        <img src="images/logo-192.png" alt="BS Gamer_z." class="error-logo">
        <h1 class="error-title">404</h1>
        <p class="error-text">Oops! This page doesn't exist.<br>Looks like you took a wrong turn in the battleground!</p>
        <a href="./index.html" class="home-btn">🏠 Go Back Home</a>
    </div>

</body>
</html>
